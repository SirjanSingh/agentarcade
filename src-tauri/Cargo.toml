[package]
name = "agentarcade"
version = "2.1.0"
description = "Mini-games while your coding agent thinks"
authors = ["Sirjan Singh"]
license = "MIT"
repository = "https://github.com/SirjanSingh/agentarcade"
edition = "2021"
# is_none_or (used in logic/hooks.rs) stabilised in 1.82.
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# In-app updates. Artifacts are signed at release time with a key that
# lives only in the TAURI_SIGNING_PRIVATE_KEY repo secret; the binary
# carries the matching public key and refuses anything it cannot verify.
# Without the default `zip` feature: it pulls in zip 4.x (RUSTSEC-2026-0367,
# -0368, -0369; fixed only in 9.x, which the plugin does not support yet) and
# is used solely for legacy .zip Windows updates and Linux AppImage updates.
# We publish NSIS .exe updates for Windows and .app.tar.gz for macOS, whose
# tar/flate2 dependencies are unconditional. Turn it back on before shipping
# Linux self-updates.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the user's settings.json key order intact through an
# install/uninstall round trip — see logic/hooks.rs.
serde_json = { version = "1", features = ["preserve_order"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
