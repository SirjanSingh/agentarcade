# Runs on every push and pull request. Release builds live in release.yml and
# stay tag-only — this is the gate that keeps a broken build from ever reaching
# a tag in the first place.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo test + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The frontend is not built here: cargo test exercises the Rust logic
      # modules only, and tauri-build does not need dist/ to compile them.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend:
    name: tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # `npm run build` is tsc --noEmit followed by vite build, so this covers
      # both type errors and a broken bundle.
      - run: npm run build

  game-ids:
    name: game id drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: node scripts/check-game-ids.mjs

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary, so this job stays under a minute. Deliberately not
      # rustsec/audit-check: that one wants issues:write and files GitHub
      # issues, which is noise on a repo with one maintainer.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # 10 direct dependencies pull in 484 transitive crates that nothing was
      # scanning before. Default behaviour: a real advisory fails the job, an
      # `unmaintained` or `unsound` warning prints and passes.
      #
      # Not `--deny warnings`. As of writing that fails on 18 warnings, 16 of
      # which are the gtk-rs 0.18 GTK3 bindings Tauri pulls in for its Linux
      # backend. They are unreachable on Windows and macOS, and unfixable here
      # until Tauri moves off them. A gate that is red for reasons nobody can
      # act on gets ignored, and then it is not a gate.
      - name: Audit
        run: cargo audit --file src-tauri/Cargo.lock
