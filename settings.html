<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agentarcade</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <div id="settings">
      <nav id="views" role="tablist" aria-label="Sections">
        <button type="button" role="tab" data-view="welcome">Setup</button>
        <button type="button" role="tab" data-view="status">Status</button>
        <button type="button" role="tab" data-view="options">Options</button>
        <button type="button" role="tab" data-view="games">Games</button>
      </nav>
      <main id="panel"></main>
      <footer id="signature">
        <span>made by <button type="button" class="link" data-link="author">Sirjan Singh</button></span>
        <span class="links">
          <button type="button" class="link" data-link="repo">Star on GitHub</button>
          <span aria-hidden="true">·</span>
          <button type="button" class="link" data-link="coffee">Buy me a coffee</button>
        </span>
      </footer>
    </div>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
